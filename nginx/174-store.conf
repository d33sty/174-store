upstream 174-store {
    server web:8000;
}

server {
    listen 80;
    server_name 174-store.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 174-store.ru;

    ssl_certificate /etc/letsencrypt/live/174-store.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/174-store.ru/privkey.pem;

    client_max_body_size 20M;
    charset utf-8;

    gzip on;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

    # Медиафайлы отдаёт nginx напрямую, минуя app-сервер
    location /api/media/ {
        alias /var/www/media/;
    }

    # API-запросы проксируются на FastAPI (срезаем префикс /api)
    location /api/ {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://174-store/;
    }

    # Фронтенд — SPA, все остальные пути отдают index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
