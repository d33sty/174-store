services:
  web:
    build:
      # Указываем контекст сборки - текущую директорию проекта
      context: .
      # Используем Dockerfile из директории app
      dockerfile: ./app/Dockerfile
    env_file:
      - .env
    environment:
      - DB_HOST=db
    # Запускаем ASGI-приложение через сервер приложений Uvicorn
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    # Монтируем код и медиафайлы — изменения подхватываются без пересборки образа
    volumes:
      - ./app:/home/fast/app
      - ./media:/home/fast/media
    # Открываем порт 8000 внутри и снаружи
    ports:
      - 8000:8000
    # Запускаем контейнер после старта контейнера базы данных
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - 5173:5173
    environment:
      - API_TARGET=http://web:8000
      - VITE_YANDEX_MAPS_API_KEY=${VITE_YANDEX_MAPS_API_KEY}
      - VITE_OWNER_NAME=${VITE_OWNER_NAME}
      - VITE_OWNER_PHONE=${VITE_OWNER_PHONE}
      - VITE_OWNER_INN=${VITE_OWNER_INN}
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - web

  db:
    # Используем официальный образ PostgreSQL версии 16
    image: postgres:16
    # Монтируем том postgres_data в /var/lib/postgresql/data контейнера для хранения данных БД
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Задаём переменные окружения для инициализации БД и пользователя
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}

volumes:
  postgres_data:
  frontend_node_modules:
