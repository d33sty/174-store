<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>174 Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0d0d1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Пульсирующий градиент фона */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: glow 6s ease-in-out infinite;
        }
        .bg-glow-1 {
            width: 500px; height: 500px;
            background: rgba(255, 90, 30, 0.12);
            top: -100px; left: -100px;
        }
        .bg-glow-2 {
            width: 400px; height: 400px;
            background: rgba(120, 40, 200, 0.1);
            bottom: -80px; right: -80px;
            animation-delay: -3s;
        }
        @keyframes glow {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 560px;
            width: 100%;
        }

        /* Бейдж */
        .badge {
            display: inline-block;
            background: rgba(255, 90, 30, 0.12);
            border: 1px solid rgba(255, 90, 30, 0.35);
            color: #ff6b35;
            padding: 0.35rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            animation: fadein 0.6s ease both;
        }

        @keyframes fadein {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1;
            margin-bottom: 1rem;
            animation: fadein 0.6s ease 0.1s both;
        }

        h1 .accent {
            background: linear-gradient(135deg, #ff6b35 0%, #ffaa80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255,255,255,0.45);
            line-height: 1.7;
            margin-bottom: 2rem;
            animation: fadein 0.6s ease 0.2s both;
        }

        .docs-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #ff6b35, #e04e1a);
            color: #fff;
            text-decoration: none;
            padding: 0.75rem 1.75rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 24px rgba(255, 90, 30, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadein 0.6s ease 0.3s both;
        }
        .docs-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(255, 90, 30, 0.5);
        }
        .docs-btn svg { flex-shrink: 0; }

        /* Кликер */
        .clicker {
            margin-top: 3.5rem;
            animation: fadein 0.6s ease 0.4s both;
        }

        .clicker-hint {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.08em;
            margin-bottom: 1.2rem;
            min-height: 1.2em;
            transition: color 0.3s;
        }

        .cart-wrap {
            position: relative;
            display: inline-block;
        }

        .cart-btn {
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.09);
            border-radius: 24px;
            padding: 1.5rem 3rem;
            cursor: pointer;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            transition: border-color 0.2s, background 0.2s, transform 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .cart-btn:hover {
            border-color: rgba(255, 90, 30, 0.3);
            background: rgba(255, 90, 30, 0.06);
        }
        .cart-btn:active { transform: scale(0.94); }

        .cart-icon {
            font-size: 3.5rem;
            line-height: 1;
            display: block;
            transition: transform 0.15s;
        }

        .cart-btn.pop .cart-icon {
            animation: pop 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }
        @keyframes pop {
            0%   { transform: scale(1) rotate(0deg); }
            25%  { transform: scale(1.35) rotate(-8deg); }
            60%  { transform: scale(0.88) rotate(4deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .cart-label {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
        }
        .cart-label strong {
            color: #ff6b35;
            font-size: 1rem;
            font-weight: 700;
        }

        /* Всплывающий +1 */
        .floaty {
            position: absolute;
            font-size: 1.1rem;
            font-weight: 800;
            color: #ff6b35;
            pointer-events: none;
            animation: floatup 0.75s ease-out forwards;
            white-space: nowrap;
        }
        @keyframes floatup {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to   { opacity: 0; transform: translateY(-65px) scale(0.6); }
        }

        /* Счётчик рекордов */
        .streak {
            margin-top: 1rem;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.18);
            letter-spacing: 0.05em;
            min-height: 1em;
        }
    </style>
</head>
<body>

<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="container">
    <span class="badge">В разработке</span>

    <h1>174 <span class="accent">Store</span></h1>

    <p class="subtitle">
        Интернет-магазин скоро откроется.<br>
        API уже готово и доступно для интеграции.
    </p>

    <a href="/docs" class="docs-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Документация API
    </a>

    <div class="clicker">
        <p class="clicker-hint" id="hint">пока можно вот сюда</p>
        <div class="cart-wrap" id="cartWrap">
            <button class="cart-btn" id="cartBtn">
                <span class="cart-icon">🛒</span>
                <span class="cart-label">в корзине: <strong id="count">0</strong> товаров</span>
            </button>
        </div>
        <p class="streak" id="streak"></p>
    </div>
</div>

<script>
    let count = 0;
    let lastClickTime = 0;
    let streakTimer = null;

    const btn    = document.getElementById('cartBtn');
    const wrap   = document.getElementById('cartWrap');
    const countEl = document.getElementById('count');
    const hint   = document.getElementById('hint');
    const streak = document.getElementById('streak');

    const milestones = {
        1:   '(о, работает)',
        5:   'неплохое начало',
        10:  '🎉 десятка!',
        25:  'серьёзный подход',
        50:  '🔥 полсотни. зачем?',
        100: '💀 100 товаров в корзине',
        200: 'это уже проблема',
        500: '🚀 500. ты легенда.',
        1000:'🤡 ладно, мы сдаёмся',
    };

    btn.addEventListener('click', function(e) {
        count++;
        countEl.textContent = count;

        // pop-анимация
        btn.classList.remove('pop');
        void btn.offsetWidth;
        btn.classList.add('pop');

        // плавающий +1
        const rect = wrap.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const f = document.createElement('span');
        f.className = 'floaty';
        f.textContent = '+1';
        f.style.left = (e.clientX - wrapRect.left - 12) + 'px';
        f.style.top  = (e.clientY - wrapRect.top  - 20) + 'px';
        wrap.appendChild(f);
        setTimeout(() => f.remove(), 750);

        // milestone-сообщения
        if (milestones[count]) hint.textContent = milestones[count];

        // стрик кликов в секунду
        const now = Date.now();
        if (now - lastClickTime < 400) {
            clearTimeout(streakTimer);
            streak.textContent = 'быстро кликаешь 👀';
            streakTimer = setTimeout(() => { streak.textContent = ''; }, 1200);
        }
        lastClickTime = now;
    });
</script>
</body>
</html>
